name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install CPU-only PyTorch (avoids ~2 GB of CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # No dataset download: tests use synthetic images and the committed checkpoint
        run: pytest

      - name: Test ML validation suite
        # Standalone research tests do not need the Kaggle or PlantDoc datasets.
        run: pytest ml_validation/tests/
